version: "3.8"

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=${DOCKER_INFLUXDB_INIT_MODE:-setup}
      - DOCKER_INFLUXDB_INIT_USERNAME=${DOCKER_INFLUXDB_INIT_USERNAME:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${DOCKER_INFLUXDB_INIT_PASSWORD:-adminpassword}
      - DOCKER_INFLUXDB_INIT_ORG=${DOCKER_INFLUXDB_INIT_ORG:-iot-pulse}
      - DOCKER_INFLUXDB_INIT_BUCKET=${DOCKER_INFLUXDB_INIT_BUCKET:-sensor_data}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN:-iot-pulse-dev-token}
    volumes:
      - influxdb-data:/var/lib/influxdb2
    restart: unless-stopped

  ingester:
    build:
      context: .
      dockerfile: ingester/Dockerfile
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN:-iot-pulse-dev-token}
      - INFLUX_ORG=${DOCKER_INFLUXDB_INIT_ORG:-iot-pulse}
      - INFLUX_BUCKET=${DOCKER_INFLUXDB_INIT_BUCKET:-sensor_data}
    depends_on:
      - mosquitto
      - influxdb
    restart: unless-stopped

  simulators:
    build:
      context: .
      dockerfile: simulators/Dockerfile
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
    depends_on:
      - mosquitto
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN:-iot-pulse-dev-token}
      - INFLUX_ORG=${DOCKER_INFLUXDB_INIT_ORG:-iot-pulse}
      - INFLUX_BUCKET=${DOCKER_INFLUXDB_INIT_BUCKET:-sensor_data}
    depends_on:
      - influxdb
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mosquitto-data:
  influxdb-data:
